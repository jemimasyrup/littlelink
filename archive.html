<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Archive - wee.luke</title>

  <link rel="icon" type="image/png" href="/images/avatar.png">
  <link rel="stylesheet" href="css/xp.css">

  <style>
    #archive-window { --window-width: 700px; }
  </style>
</head>

<body>
  <main class="desktop desktop--single">
    <section class="xp-window xp-window--center" id="archive-window" data-title="Music Archive">
      <div class="xp-titlebar">
        <span class="xp-title"><img src="images/icons/spotify.svg" alt="">Music Archive</span>
      </div>

      <div class="xp-content">
        <div class="stat-strip">
          <div class="stat xp-panel"><b id="stat-plays">–</b><small>plays archived</small></div>
          <div class="stat xp-panel"><b id="stat-tracks">–</b><small>different songs</small></div>
          <div class="stat xp-panel"><b id="stat-artists">–</b><small>artists</small></div>
        </div>

        <div class="xp-tabs" role="tablist">
          <button type="button" class="xp-tab" role="tab" data-view="week" aria-selected="true">Last 7 days</button>
          <button type="button" class="xp-tab" role="tab" data-view="month" aria-selected="false">Last 30 days</button>
          <button type="button" class="xp-tab" role="tab" data-view="all" aria-selected="false">All time</button>
          <button type="button" class="xp-tab" role="tab" data-view="recent" aria-selected="false">Recent plays</button>
        </div>

        <div class="xp-tabpanel" id="archive-panel" role="tabpanel">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <footer class="xp-statusbar">
        <span id="archive-status">&nbsp;</span>
        <a href="index.html">Back to desktop</a>
      </footer>
    </section>
  </main>

  <script src="js/xp.js"></script>

  <script>
    const panel = document.getElementById("archive-panel");

    let currentView = "week";

    function rowHTML({ rank, art, url, title, subtitle, meta, share }) {
      const tag = url ? "a" : "div";
      const link = url ? ` href="${XP.escapeHTML(url)}" target="_blank" rel="noopener"` : "";

      return `
        <${tag} class="media-row"${link}>
          ${rank ? `<span class="media-rank">${rank}</span>` : ""}
          <img src="${XP.escapeHTML(art)}" alt="" loading="lazy">

          <div class="media-info">
            <strong>${XP.escapeHTML(title)}</strong>
            ${subtitle ? `<span>${XP.escapeHTML(subtitle)}</span>` : ""}
            ${share !== undefined ? `<div class="play-bar"><i style="width:${share}%"></i></div>` : ""}
          </div>

          <span class="media-meta">${XP.escapeHTML(meta)}</span>
        </${tag}>
      `;
    }

    function playsText(plays) {
      return `${plays} play${plays === 1 ? "" : "s"}`;
    }

    function topListHTML(items, toRow) {
      if (!items.length) {
        return `<div class="empty-state">Nothing archived for this period yet.</div>`;
      }

      const most = Number(items[0].plays) || 1;

      return items.map((item, index) => {
        const plays = Number(item.plays) || 0;

        return rowHTML({
          rank: index + 1,
          art: XP.safeURL(item.album_art, "images/icons/spotify.svg"),
          meta: playsText(plays),
          share: Math.round((plays / most) * 100),
          ...toRow(item)
        });
      }).join("");
    }

    async function getJSON(url) {
      const response = await fetch(url);

      if (!response.ok) throw new Error("Request failed");

      return response.json();
    }

    async function showTop(range) {
      const [tracks, artists] = await Promise.all([
        getJSON(`/api/archive/top?range=${range}`),
        getJSON(`/api/archive/top?range=${range}&type=artists`)
      ]);

      // A slow response for a tab the visitor has already left is dropped
      if (currentView !== range) return;

      panel.innerHTML = `
        <div class="archive-columns">
          <div>
            <p class="section-label">Top songs</p>
            <div class="xp-panel">
              ${topListHTML(tracks, track => ({
                url: XP.safeURL(track.track_url),
                title: track.track_name,
                subtitle: track.artist
              }))}
            </div>
          </div>

          <div>
            <p class="section-label">Top artists</p>
            <div class="xp-panel">
              ${topListHTML(artists, artist => ({
                url: `https://www.last.fm/music/${encodeURIComponent(artist.artist)}`,
                title: artist.artist
              }))}
            </div>
          </div>
        </div>
      `;
    }

    async function showRecent() {
      const tracks = await getJSON("/api/archive/recent");

      if (currentView !== "recent") return;

      panel.innerHTML = `
        <div class="xp-panel">
          ${tracks.length
            ? tracks.map(track => rowHTML({
                art: XP.safeURL(track.album_art, "images/icons/spotify.svg"),
                url: XP.safeURL(track.track_url),
                title: track.track_name,
                subtitle: track.artist,
                meta: XP.formatWhen(track.played_at)
              })).join("")
            : `<div class="empty-state">No plays archived yet.</div>`}
        </div>
      `;
    }

    async function showView(view) {
      currentView = view;

      document.querySelectorAll(".xp-tab").forEach(tab => {
        tab.setAttribute("aria-selected", String(tab.dataset.view === view));
      });

      try {
        await (view === "recent" ? showRecent() : showTop(view));
      } catch {
        if (currentView === view) {
          panel.innerHTML = `<div class="empty-state">Failed to load the archive. Try again in a moment.</div>`;
        }
      }
    }

    async function loadStats() {
      try {
        const stats = await getJSON("/api/archive/stats");

        document.getElementById("stat-plays").textContent = stats.plays.toLocaleString();
        document.getElementById("stat-tracks").textContent = stats.tracks.toLocaleString();
        document.getElementById("stat-artists").textContent = stats.artists.toLocaleString();

        const parts = [];

        if (stats.first_played_at) {
          const first = new Date(stats.first_played_at).toLocaleDateString([], {
            day: "numeric",
            month: "short",
            year: "numeric"
          });

          parts.push(`Archive starts ${first}`);
        }

        if (stats.catching_up) {
          parts.push("still importing older plays");
        } else if (stats.synced_at) {
          parts.push(`updated ${XP.formatWhen(stats.synced_at)}`);
        }

        document.getElementById("archive-status").textContent = parts.join(" · ") || "Updates automatically";

        return stats;
      } catch {
        document.getElementById("archive-status").textContent = "Updates automatically";
        return null;
      }
    }

    document.querySelectorAll(".xp-tab").forEach(tab => {
      tab.addEventListener("click", () => showView(tab.dataset.view));
    });

    // The archive normally fills itself in on a schedule. If it's empty or
    // still importing history, opening this page gives it a push.
    async function start() {
      showView(currentView);

      const stats = await loadStats();

      if (stats && (!stats.plays || stats.catching_up)) {
        try {
          await fetch("/api/archive/update", { method: "POST" });
          await Promise.all([loadStats(), showView(currentView)]);
        } catch {
          // The schedule will catch up on its own
        }
      }
    }

    start();
  </script>
</body>
</html>
