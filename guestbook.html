<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/images/avatar.png">
  <title>Guestbook - wee.luke</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #3a7d2c url("grass.jpg") center center / cover no-repeat fixed;
      font-family: Tahoma, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .xp-window {
      width: 520px;
      max-width: calc(100vw - 30px);
      background: #ece9d8;
      border: 3px solid #0054e3;
      border-radius: 10px 10px 4px 4px;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .xp-titlebar {
      background: linear-gradient(to bottom, #3f8cff, #0054e3);
      color: white;
      padding: 8px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      text-shadow: 1px 1px #003c9e;
    }

    .xp-content {
      padding: 18px;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 8px;
      border: 2px inset white;
      font-family: Tahoma, Verdana, sans-serif;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button, a.button {
      display: inline-block;
      padding: 8px 14px;
      background: linear-gradient(to bottom, #ffffff, #d6d2c2);
      border: 2px outset white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      font-family: Tahoma, Verdana, sans-serif;
      margin-right: 6px;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border: 2px inset white;
      font-size: 13px;
    }

    .message small {
      color: #555;
    }

    .message {
      word-break: break-word;
    }

    #form-status {
      margin: 10px 0 0;
      font-size: 13px;
      color: #b00020;
      min-height: 1em;
    }
  </style>
</head>

<body>
  <div class="xp-window">
    <div class="xp-titlebar">
      <span>Guestbook.exe</span>
      <span>_ □ X</span>
    </div>

    <div class="xp-content">
      <h2>Sign my guestbook</h2>

      <input id="website" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input id="name" placeholder="Your name" maxlength="24" aria-label="Your name">
      <textarea id="message" placeholder="Say something iconic..." maxlength="180" aria-label="Your message"></textarea>

      <button id="sign-button" type="button" onclick="signGuestbook()">Sign Guestbook</button>
      <a class="button" href="index.html">Back</a>

      <p id="form-status" role="status"></p>

      <div id="messages"></div>
    </div>
  </div>

  <script>
    async function loadGuestbook() {
      const box = document.getElementById("messages");

      try {
        const response = await fetch("/api/guestbook");

        if (!response.ok) throw new Error("Request failed");

        const messages = await response.json();

        box.innerHTML = messages.map(item => `
          <div class="message">
            <strong>${escapeHTML(item.name)}</strong><br>
            ${escapeHTML(item.message)}<br>
            <small>${escapeHTML(formatDate(item.created_at))}</small>
          </div>
        `).join("");
      } catch {
        box.innerHTML = `<div class="message">Guestbook failed to load.</div>`;
      }
    }

    async function signGuestbook() {
      const nameInput = document.getElementById("name");
      const messageInput = document.getElementById("message");
      const button = document.getElementById("sign-button");
      const status = document.getElementById("form-status");

      const name = nameInput.value.trim();
      const message = messageInput.value.trim();
      const website = document.getElementById("website").value;

      if (!name || !message) {
        status.textContent = "Please enter a name and a message.";
        return;
      }

      button.disabled = true;
      status.textContent = "";

      try {
        const response = await fetch("/api/guestbook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            message,
            website
          })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          status.textContent = data.error || "Could not sign the guestbook. Try again.";
          return;
        }

        // Only clear the form once the message has actually been saved
        nameInput.value = "";
        messageInput.value = "";

        await loadGuestbook();
      } catch {
        status.textContent = "Could not sign the guestbook. Try again.";
      } finally {
        button.disabled = false;
      }
    }

    function formatDate(value) {
      const date = new Date(value);
      return isNaN(date) ? "" : date.toLocaleString();
    }

    function escapeHTML(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadGuestbook();
  </script>
</body>
</html>
