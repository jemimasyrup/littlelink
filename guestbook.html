<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook - wee.luke</title>

  <link rel="icon" type="image/png" href="/images/avatar.png">
  <link rel="stylesheet" href="css/xp.css">

  <style>
    #guestbook-window { --window-width: 540px; }
  </style>
</head>

<body>
  <main class="desktop desktop--single">
    <section class="xp-window xp-window--center" id="guestbook-window" data-title="Guestbook">
      <div class="xp-titlebar">
        <span class="xp-title"><img src="images/icons/generic-review.svg" alt="">Guestbook</span>
      </div>

      <div class="xp-content">
        <fieldset class="xp-group">
          <legend>Sign my guestbook</legend>

          <input id="website" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">

          <div class="form-row">
            <input class="xp-input" id="name" placeholder="Your name" maxlength="24" aria-label="Your name">
          </div>

          <div class="form-row">
            <textarea class="xp-input" id="message" placeholder="Say something iconic..." maxlength="180" aria-label="Your message"></textarea>
          </div>

          <div class="form-actions">
            <button class="xp-button xp-button--default" id="sign-button" type="button" onclick="signGuestbook()">Sign Guestbook</button>
            <a class="xp-button" href="index.html">Back</a>
            <span class="form-count" id="message-count">0 / 180</span>
          </div>

          <p class="form-status" id="form-status" role="status"></p>
        </fieldset>

        <p class="section-label">Messages</p>
        <div id="messages" class="xp-panel">
          <div class="empty-state">Loading messages...</div>
        </div>
      </div>

      <footer class="xp-statusbar">
        <span id="message-total">&nbsp;</span>
        <span>Be nice!</span>
      </footer>
    </section>
  </main>

  <script src="js/xp.js"></script>

  <script>
    const messageInput = document.getElementById("message");
    const messageCount = document.getElementById("message-count");

    messageInput.addEventListener("input", () => {
      messageCount.textContent = `${messageInput.value.length} / 180`;
    });

    async function loadGuestbook() {
      const box = document.getElementById("messages");

      try {
        const response = await fetch("/api/guestbook");

        if (!response.ok) throw new Error("Request failed");

        const messages = await response.json();

        if (!messages.length) {
          box.innerHTML = `<div class="empty-state">No messages yet. Be the first!</div>`;
        } else {
          box.innerHTML = messages.map(item => `
            <article class="guest-message">
              <header>
                <strong>${XP.escapeHTML(item.name)}</strong>
                <small>${XP.escapeHTML(XP.formatWhen(item.created_at))}</small>
              </header>
              ${XP.escapeHTML(item.message)}
            </article>
          `).join("");
        }

        document.getElementById("message-total").textContent =
          `Showing the latest ${messages.length} message${messages.length === 1 ? "" : "s"}`;
      } catch {
        box.innerHTML = `<div class="empty-state">Guestbook failed to load.</div>`;
      }
    }

    async function signGuestbook() {
      const nameInput = document.getElementById("name");
      const button = document.getElementById("sign-button");
      const status = document.getElementById("form-status");

      const name = nameInput.value.trim();
      const message = messageInput.value.trim();
      const website = document.getElementById("website").value;

      if (!name || !message) {
        status.textContent = "Please enter a name and a message.";
        return;
      }

      button.disabled = true;
      status.textContent = "";

      try {
        const response = await fetch("/api/guestbook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            message,
            website
          })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          status.textContent = data.error || "Could not sign the guestbook. Try again.";
          return;
        }

        // Only clear the form once the message has actually been saved
        nameInput.value = "";
        messageInput.value = "";
        messageCount.textContent = "0 / 180";

        await loadGuestbook();
      } catch {
        status.textContent = "Could not sign the guestbook. Try again.";
      } finally {
        button.disabled = false;
      }
    }

    loadGuestbook();
  </script>
</body>
</html>
